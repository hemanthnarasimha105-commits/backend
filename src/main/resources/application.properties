############################################################
# APPLICATION
############################################################
spring.application.name=SentinelCore SecureOps

# Render provides PORT automatically
server.port=${PORT:8080}


############################################################
# DATABASE
############################################################
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver


############################################################
# JPA / HIBERNATE
############################################################
spring.jpa.hibernate.ddl-auto=update

# Disable SQL logging in production
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Hibernate automatically detects PostgreSQL
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Kolkata

# Recommended for REST APIs
spring.jpa.open-in-view=false


############################################################
# HIKARI CONNECTION POOL
############################################################
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=30000


############################################################
# JWT
############################################################
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000


############################################################
# GMAIL SMTP
############################################################
spring.mail.host=smtp.gmail.com
spring.mail.port=587

spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

spring.mail.default-encoding=UTF-8


############################################################
# LOGGING
############################################################
logging.level.root=INFO
logging.level.com.internship.infosys=INFO
logging.level.org.springframework.mail=INFO
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=INFO


############################################################
# SWAGGER / OPENAPI
############################################################
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html


############################################################
# FILE UPLOAD
############################################################
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB


############################################################
# SERVER ERROR
############################################################
server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=never


############################################################
# JACKSON
############################################################
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=Asia/Kolkata


############################################################
# ACTUATOR
############################################################
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always


############################################################
# CACHE
############################################################
spring.cache.type=simple


############################################################
# THYMELEAF
############################################################
spring.thymeleaf.cache=false


############################################################
# SPRING AI / OPENAI
############################################################
spring.ai.openai.api-key=${OPENAI_API_KEY}
spring.ai.openai.chat.options.model=gpt-4.1-mini
spring.ai.openai.chat.options.temperature=0.7
spring.ai.openai.chat.options.max-tokens=1000
