############################################################
# APPLICATION
############################################################

spring.application.name=Cloud Security Monitoring System

server.port=${PORT:8080}


############################################################
# DATABASE
############################################################

spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver


############################################################
# JPA
############################################################

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Kolkata


############################################################
# HIKARI
############################################################

spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=30000


############################################################
# JWT
############################################################

jwt.secret=${JWT_SECRET}
jwt.expiration=86400000


############################################################
# BREVO EMAIL API
############################################################

brevo.api.url=https://api.brevo.com/v3/smtp/email
brevo.api.key=${BREVO_API_KEY}

brevo.sender.email=${BREVO_SENDER_EMAIL}
brevo.sender.name=Cloud Security Monitoring System


############################################################
# LOGGING
############################################################

logging.level.root=INFO
logging.level.com.internship.infosys=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG


############################################################
# SWAGGER
############################################################

springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html


############################################################
# FILE UPLOAD
############################################################

spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB


############################################################
# SERVER ERROR
############################################################

server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=never


############################################################
# JACKSON
############################################################

spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=Asia/Kolkata


############################################################
# ACTUATOR
############################################################

management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always


############################################################
# CACHE
############################################################

spring.cache.type=simple


############################################################
# THYMELEAF
############################################################

spring.thymeleaf.cache=false


############################################################
# SPRING AI
############################################################

spring.ai.openai.api-key=${OPENAI_API_KEY}
spring.ai.openai.chat.options.model=gpt-4.1-mini
spring.ai.openai.chat.options.temperature=0.7
spring.ai.openai.chat.options.max-tokens=1000
